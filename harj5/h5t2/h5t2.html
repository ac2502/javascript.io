<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>H05T02 API</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Chuck Norris ei sano moi vaan hän saa netin tervehtimään puolestaan! </h1> <br>
  <img src="norris.jpg" alt="Chuck Norris" id="norris-image">

  <button onclick="haeFakta()">Chuck Norris ei klikkaa nappia. Nappi toimii itsestään</button>
  <div id="fact">Tämä ei ole satunnainen fakta. Chuck Norris valitsi sen itse</div>

  <script>
    async function haeFakta() {
      try {
        const vastaus = await fetch("https://api.chucknorris.io/jokes/random");
        const data = await vastaus.json();
        document.getElementById("fact").innerText = data.value;
      } catch (error) {
        document.getElementById("fact").innerText = "Faktan hakeminen epäonnistui.";
        console.error(error);
      }
    }
  </script>
</body>
</html>
